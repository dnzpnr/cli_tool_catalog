name: usql
description: Universal SQL CLI — MySQL, SQL Server, Oracle, SQLite, Snowflake and more; Oracle Instant Client is not required because the Oracle driver is pure Go (verified client-free with v0.21.6 against Oracle Free 23ai); example DSN oracle://user:pass@host:1521/service
license: MIT
capabilities_hint: [multi_database_sql]
install_method: archive
source:
  repo: https://github.com/xo/usql
  version: v0.21.6
  asset: https://github.com/xo/usql/releases/download/v0.21.6/usql-0.21.6-linux-amd64.tar.bz2
  sha256: b3046140f8f2add0e2afaaa595b824d445e933d400a00d50a1c038760d4ce13c
  archive: tar.bz2
  binary_path: usql
detect:
  listening_port: [5432, 3306, 1433, 1521]
  binary_path: [/usr/local/bin/usql, /usr/bin/usql]
credential_env_vars: [USQL_DSN]
verify_command: 'usql "$USQL_DSN" -c "\conninfo"'
log_source_hint:
  kind: none
