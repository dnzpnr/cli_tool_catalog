name: mindalert-slack
description: "Slack CLI — auth-test, history and send commands; preserves native thread_ts thread/session fields without flattening"
license: MIT
capabilities_hint: [slack_read, slack_send]
install_method: archive
source:
  repo: https://github.com/dnzpnr/mindalert-cli-tools
  version: v0.1.1
  asset: https://github.com/dnzpnr/mindalert-cli-tools/releases/download/v0.2.1/mindalert-slack-0.1.1.tar.gz
  sha256: 91bd0a84b703f091b43f8004e8d660788fcb9e958a089b206aaedf8112d65d42
  archive: tar.gz
  binary_path: mindalert-slack
detect:
  binary_path: [/usr/local/bin/mindalert-slack, /usr/bin/mindalert-slack]
credential_env_vars: [SLACK_BOT_TOKEN]
verify_command: "mindalert-slack auth-test"
log_source_hint:
  kind: none
