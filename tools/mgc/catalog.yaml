name: mgc
description: DEPRECATED (upstream msgraph-cli archived 2025-08-29) — use mindalert-graph. Microsoft Graph CLI — Outlook, OneDrive, Teams, Calendar
superseded_by: mindalert-graph
license: MIT
capabilities_hint: [ms365_mail, ms365_onedrive, ms365_teams, ms365_calendar]
install_method: archive
source:
  repo: https://github.com/microsoftgraph/msgraph-cli
  version: v1.9.0
  asset: https://github.com/microsoftgraph/msgraph-cli/releases/download/v1.9.0/msgraph-cli-linux-x64-1.9.0.tar.gz
  sha256: fe550ffb29b8455be7994303cf8c2563791e1112848374155b012b0cc93e1668
  archive: tar.gz
  binary_path: mgc
detect:
  binary_path: [/usr/local/bin/mgc, /usr/bin/mgc]
credential_env_vars: []
verify_command: "mgc me get"
monitoring_class: B
monitoring:
  probe:
    command: "mgc me get"
    interval: 30m
log_source_hint:
  kind: none
  reason: "kendi günlüğü yok; sağlık/kimlik doğrulaması monitoring.probe ile yoklanır."
