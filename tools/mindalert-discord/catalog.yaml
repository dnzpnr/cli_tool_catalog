name: mindalert-discord
description: "Discord CLI — auth-test, history and send commands; preserves native message_reference and thread fields without flattening"
license: MIT
capabilities_hint: [discord_read, discord_send]
install_method: archive
source:
  repo: https://github.com/dnzpnr/mindalert-cli-tools
  version: v0.1.0
  asset: https://github.com/dnzpnr/mindalert-cli-tools/releases/download/v0.2.1/mindalert-discord-0.1.0.tar.gz
  sha256: 41e35eac8544bb97d0e2818044e86cd41794a9703b7a5ae281402e4cd77e0f20
  archive: tar.gz
  binary_path: mindalert-discord
detect:
  binary_path: [/usr/local/bin/mindalert-discord, /usr/bin/mindalert-discord]
credential_env_vars: [DISCORD_BOT_TOKEN]
verify_command: "mindalert-discord auth-test"
log_source_hint:
  kind: none
