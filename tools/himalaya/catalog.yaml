name: himalaya
description: Email CLI — IMAP/JMAP/Gmail/Microsoft Graph mailboxes; requires ~/.config/himalaya/config.toml and an account with default = true (otherwise mailbox list returns "No default account found"); read the password from the environment with imap.sasl.plain.password.command = ["printenv", "HIMALAYA_IMAP_PASSWORD"]; Gmail requires 2-Step Verification and an app password, which grants access to the ENTIRE mailbox with no read-only boundary (use Gmail API/OAuth via gws for read-only authorization); Gmail folder names are localized (for example, Turkish [Gmail]/Gönderilmiş Postalar), so configure aliases accordingly
license: MIT
capabilities_hint: [mail_read, mail_send]
install_method: archive
source:
  repo: https://github.com/pimalaya/himalaya
  version: v2.1.0
  asset: https://github.com/pimalaya/himalaya/releases/download/v2.1.0/himalaya.x86_64-linux.tgz
  sha256: 683a2ab8e1534f01e6bda3a69e204d564c31fbfbe20511fc7bc60b67f2e85884
  archive: tgz
  binary_path: himalaya
detect:
  binary_path: [/usr/local/bin/himalaya, /usr/bin/himalaya]
credential_env_vars: [HIMALAYA_IMAP_PASSWORD]
verify_command: "himalaya mailbox list"
monitoring_class: B
monitoring:
  probe:
    command: "himalaya mailbox list"
    interval: 30m
log_source_hint:
  kind: none
  reason: "kendi günlüğü yok; sağlık/kimlik doğrulaması monitoring.probe ile yoklanır."
