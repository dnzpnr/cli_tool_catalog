name: mindalert-video
description: "MindAlert video editing and HyperFrames rendering in a networkless namespace; requires system ffmpeg"
license: MIT
capabilities_hint: [video_editing, video_rendering]
install_method: archive
source:
  repo: https://github.com/dnzpnr/mindalert-cli-tools
  version: v0.2.0
  asset: https://github.com/dnzpnr/mindalert-cli-tools/releases/download/v0.5.0/mindalert-video-0.2.0.tar.gz
  sha256: 657ffcd44824d99b941788e9b340fd37b00d49475c55e4546950b2d6d41af64d
  archive: tar.gz
  binary_path: mindalert-video
detect:
  binary_path: [/usr/local/bin/mindalert-video, /usr/bin/mindalert-video]
credential_env_vars: [MINDALERT_VIDEO_ROOT]
verify_command: "mindalert-video doctor"
monitoring_class: B
monitoring:
  probe:
    command: "mindalert-video doctor"
    interval: 1h
log_source_hint:
  kind: none
  reason: "kendi günlüğü yok; sağlık/kimlik doğrulaması monitoring.probe ile yoklanır."
