name: gdrive
description: Google Drive command line client
license: MIT
capabilities_hint: [gdrive_files]
install_method: archive
source:
  repo: https://github.com/glotlabs/gdrive
  version: "3.9.1"
  asset: https://github.com/glotlabs/gdrive/releases/download/3.9.1/gdrive_linux-x64.tar.gz
  sha256: 0646efa1ed15a6151ef5e1a4f723825c81935591ad7a01e86685afa8138bc7c9
  archive: tar.gz
  binary_path: gdrive
detect:
  binary_path: [/usr/local/bin/gdrive, /usr/bin/gdrive]
credential_env_vars: []
verify_command: "gdrive files list"
monitoring_class: B
monitoring:
  probe:
    command: "gdrive files list"
    interval: 30m
log_source_hint:
  kind: none
  reason: "kendi günlüğü yok; sağlık/kimlik doğrulaması monitoring.probe ile yoklanır."
